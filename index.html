<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mnanak na qalang｜泰雅族有聲繪本</title>
<style>
:root{--bg:#1b1210;--panel:#2a1b17;--line:#5a2a22;--red:#b3342a;--gold:#e7b04a;--text:#f3e6d3;--muted:#b9a58d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;overflow:hidden;
background-image:repeating-linear-gradient(45deg,rgba(179,52,42,.07) 0 14px,transparent 14px 28px),repeating-linear-gradient(-45deg,rgba(179,52,42,.07) 0 14px,transparent 14px 28px)}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:8px;flex-wrap:wrap}
.brand{font-size:15px;letter-spacing:.04em;color:var(--gold);font-style:italic}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{background:var(--red);border-color:var(--gold)}
button:disabled{opacity:.35;cursor:default}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
#stage{position:relative;width:min(100%,calc((100vh - 190px)*4/3));aspect-ratio:4/3;background:#000;border-radius:6px;box-shadow:0 10px 40px #000a;overflow:hidden;touch-action:pan-y}
#page{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#page.fade{animation:fin .4s}
@keyframes fin{from{opacity:.15}to{opacity:1}}
footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;align-items:center}
.bar{width:min(560px,100%);height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
#prog{height:100%;width:0;background:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:min(100%,calc((100vh - 190px)*4/3))}
.mid{display:flex;align-items:center;gap:10px}
.pgbtn{height:52px;min-width:52px;padding:0 16px;font-size:16px;background:var(--red);border-color:var(--gold)}
.pgbtn:disabled{background:var(--panel)}
.big{height:56px;border-radius:28px;padding:0 22px;font-size:17px;background:var(--red);border-color:var(--gold)}
.pgline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.pgline button{height:34px;font-size:13px;min-width:0}
#pg{min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.panel{position:fixed;right:10px;top:calc(62px + env(safe-area-inset-top));width:min(340px,calc(100vw - 20px));max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;z-index:20;box-shadow:0 12px 40px #000c}
.panel[hidden]{display:none}
.panel h2{font-size:16px;margin:0 0 10px;color:var(--gold)}
.ctl{margin:12px 0}
.ctl label,.sw{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--gold);height:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{height:36px;min-width:52px}
.sw input{width:22px;height:22px;accent-color:var(--gold)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#grid button{padding:0;height:auto;min-width:0;border-radius:6px;overflow:hidden;position:relative;aspect-ratio:4/3}
#grid img{width:100%;height:100%;object-fit:cover;display:block}
#grid span{position:absolute;left:3px;bottom:2px;font-size:11px;background:#000a;padding:0 4px;border-radius:4px}
#grid .cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
#grid-panel{width:min(520px,calc(100vw - 20px))}
#dbgPanel{left:10px;right:auto;top:auto;bottom:10px;width:min(380px,calc(100vw - 20px));max-height:50vh;font-size:12px;background:#120b09ee}
#dbg{margin:0;white-space:pre-wrap;word-break:break-all;font-family:Consolas,monospace;line-height:1.5}
#start{position:fixed;left:0;right:0;bottom:130px;z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;pointer-events:none}
#start button{pointer-events:auto;background:var(--red);border-color:var(--gold);font-size:18px;height:52px;padding:0 28px;border-radius:26px}
#start p{margin:0;color:var(--text);font-size:13px;background:#000b;padding:2px 10px;border-radius:10px}
#eye{position:fixed;inset:0;pointer-events:none;z-index:50;background:#ff9a1f;mix-blend-mode:multiply;opacity:0;transition:opacity .3s}
#preload{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
@media(max-width:700px){.lb{display:none}.pgbtn span{display:none}.pgbtn{padding:0 12px}.brand{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">mnanak na qalang</div>
  <div class="tools">
    <button id="bgBtn" aria-pressed="true" aria-label="背景音樂開關" title="背景音樂"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="lb">音樂</span></button>
    <button id="muteBtn" aria-pressed="false" aria-label="靜音" title="靜音（M）"><svg id="muteIco" viewBox="0 0 24 24"></svg><span class="lb" id="muteTxt">靜音</span></button>
    <button id="eyeBtn" aria-pressed="false" aria-label="護眼模式" title="護眼模式"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lb">護眼</span></button>
    <button id="gridBtn" aria-label="目錄" title="目錄"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span class="lb">目錄</span></button>
    <button id="setBtn" aria-label="聲音設定" title="設定"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="#2a1b17"/><circle cx="15" cy="12" r="2" fill="#2a1b17"/><circle cx="8" cy="18" r="2" fill="#2a1b17"/></svg><span class="lb">設定</span></button>
    <button id="debugBtn" aria-pressed="false" aria-label="除錯" title="除錯（D）"><svg viewBox="0 0 24 24"><path d="M8 8h8v8a4 4 0 0 1-8 0z"/><path d="M12 8V4M4 12h4M16 12h4M5 6l3 3M19 6l-3 3M5 19l3-3M19 19l-3-3"/></svg><span class="lb">除錯</span></button>
    <button id="fsBtn" aria-label="全螢幕" title="全螢幕"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<main>
  <div id="stage"><img id="page" alt="繪本第 1 頁" decoding="async"></div>
</main>

<footer>
  <div class="bar"><div id="prog"></div></div>
  <div class="row">
    <button id="prev" class="pgbtn" aria-label="上一頁"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>上一頁</span></button>
    <div class="mid">
      <button id="replay" aria-label="重播本頁"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="lb">重播</span></button>
      <button id="read" class="big" aria-label="朗讀" aria-pressed="false"><svg id="readIco" viewBox="0 0 24 24"></svg><span id="readTxt">朗讀</span></button>
    </div>
    <button id="next" class="pgbtn" aria-label="下一頁"><span>下一頁</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="pgline"><button id="first" aria-label="回到第一頁">首頁</button><span id="pg" aria-live="polite">1 / 20</span><button id="last" aria-label="跳到最後一頁">末頁</button></div>
</footer>

<section class="panel" id="setPanel" hidden aria-label="聲音設定">
  <h2>聲音與閱讀設定</h2>
  <div class="ctl"><label for="vol">朗讀音量 <b id="volV"></b></label><input id="vol" type="range" min="0" max="100"></div>
  <div class="ctl"><label for="spd">朗讀速度 <b id="spdV"></b></label>
    <input id="spd" type="range" min="0.5" max="1.5" step="0.05">
    <div class="chips"><button data-s="0.75">慢 0.75×</button><button data-s="1">正常</button><button data-s="1.25">快 1.25×</button></div></div>
  <div class="ctl"><label for="bgvol">背景音樂音量 <b id="bgvolV"></b></label><input id="bgvol" type="range" min="0" max="100"></div>
  <div class="ctl"><label for="eyeLv">護眼強度 <b id="eyeV"></b></label><input id="eyeLv" type="range" min="10" max="60"></div>
  <label class="sw"><span>翻頁後自動朗讀</span><input id="autoRead" type="checkbox"></label>
  <label class="sw"><span>朗讀完自動翻頁</span><input id="autoNext" type="checkbox"></label>
  <p style="font-size:12px;color:var(--muted);margin:8px 0 0">朗讀時，背景音樂會自動降到 30%，朗讀結束後恢復。</p>
</section>

<section class="panel" id="grid-panel" hidden aria-label="目錄"><h2>選擇頁面</h2><div id="grid"></div></section>
<section class="panel" id="dbgPanel" hidden aria-label="除錯資訊"><h2>除錯資訊（按 D 開關）</h2><pre id="dbg"></pre></section>

<div id="start"><button id="go">開始閱讀</button><p>點一下開始聲音（也可直接按下一頁）</p></div>
<div id="eye"></div>
<div id="preload" aria-hidden="true"></div>

<audio id="bg" loop preload="auto"></audio>
<audio id="voice" preload="auto"></audio>

<script>
const N=20, DUCK=0.3, $=id=>document.getElementById(id);
const bg=$('bg'),voice=$('voice'),img=$('page');
const ICON={play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',pause:'<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>',
on:'<path d="M3 9v6h4l5 4V5L7 9z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/>',off:'<path d="M3 9v6h4l5 4V5L7 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'};
let S={vol:100,spd:1,bgvol:50,bgOn:true,muted:false,eye:false,eyeLv:30,autoRead:false,autoNext:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('qalang2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('qalang2',JSON.stringify(S))}catch(e){}};
let page=0,started=false,narrating=false,logs=[];
const log=m=>{logs.unshift(new Date().toLocaleTimeString()+' '+m);logs=logs.slice(0,8)};

/* ---------- 音訊狀態 ---------- */
function applyBgVolume(){bg.volume=Math.min(1,S.bgvol/100*(narrating?DUCK:1))}
function applyAudio(){
  voice.volume=S.vol/100;voice.muted=S.muted;voice.playbackRate=S.spd;voice.defaultPlaybackRate=S.spd;
  bg.muted=S.muted;applyBgVolume();
  $('volV').textContent=S.vol+'%';$('spdV').textContent=S.spd.toFixed(2)+'×';$('bgvolV').textContent=S.bgvol+'%';$('eyeV').textContent=S.eyeLv+'%';
  $('vol').value=S.vol;$('spd').value=S.spd;$('bgvol').value=S.bgvol;$('eyeLv').value=S.eyeLv;
  $('autoRead').checked=S.autoRead;$('autoNext').checked=S.autoNext;
  $('bgBtn').setAttribute('aria-pressed',S.bgOn);
  $('muteBtn').setAttribute('aria-pressed',S.muted);$('muteBtn').setAttribute('aria-label',S.muted?'解除靜音':'靜音');$('muteTxt').textContent=S.muted?'解除靜音':'靜音';
  $('eyeBtn').setAttribute('aria-pressed',S.eye);
  $('muteIco').innerHTML=S.muted?ICON.off:ICON.on;
  $('eye').style.opacity=S.eye?S.eyeLv/100:0;
  document.querySelectorAll('[data-s]').forEach(b=>b.style.borderColor=(+b.dataset.s===+S.spd)?'var(--gold)':'');
  save();
}
function setReadUI(){const p=!voice.paused&&!voice.ended;$('readIco').innerHTML=p?ICON.pause:ICON.play;$('readTxt').textContent=p?'暫停':'朗讀';$('read').setAttribute('aria-pressed',p);$('read').setAttribute('aria-label',p?'暫停朗讀':'朗讀')}
function playBg(){if(S.bgOn)bg.play().catch(()=>{})}

/* 朗讀時背景降低、結束後恢復 */
voice.addEventListener('play',()=>{narrating=true;applyBgVolume();setReadUI();log('朗讀開始，背景音量降低')});
['pause','ended'].forEach(ev=>voice.addEventListener(ev,()=>{narrating=false;applyBgVolume();setReadUI();log('朗讀停止，背景音量恢復')}));
voice.addEventListener('ended',()=>{if(S.autoNext&&page<N-1)setTimeout(()=>{if(voice.ended)show(page+1,true)},1200)});

/* ---------- 預載下一頁/上一頁：圖片、朗讀、音樂 ---------- */
const pre={},box=$('preload');
function preload(p){
  const want=[p+1,p-1].filter(i=>i>=0&&i<N);
  Object.keys(pre).forEach(k=>{if(!want.includes(+k)){pre[k].forEach(e=>e.remove());delete pre[k]}});
  want.forEach(i=>{
    if(pre[i])return;
    const im=new Image();im.src=`assets/graphics/${i}.jpg`;im.alt='';im.dataset.preload='page-'+(i+1);
    const sp=document.createElement('audio');sp.preload='auto';sp.src=`assets/speech/speech${i}.mp3`;sp.dataset.preload='speech-'+(i+1);
    const mu=document.createElement('audio');mu.preload='auto';mu.src=`assets/music/music${i}.mp3`;mu.dataset.preload='music-'+(i+1);
    box.append(im,sp,mu);pre[i]=[im,sp,mu];
    [['image',im.src],['audio',sp.src],['audio',mu.src]].forEach(([t,u])=>{const l=document.createElement('link');l.rel='preload';l.as=t;l.href=u;document.head.appendChild(l);pre[i].push(l)});
  });
}

/* ---------- 換頁 ---------- */
let lastShow=0,audioT=null;
function loadAudio(p,readNow){
  bg.src=`assets/music/music${p}.mp3`;                // 換成本頁音樂（舊音樂被取代，不會殘留）
  voice.src=`assets/speech/speech${p}.mp3`;voice.playbackRate=S.spd;
  applyAudio();playBg();
  if(readNow&&started)voice.play().catch(()=>{});
  setReadUI();preload(p);
}
function show(p,readNow){
  p=Math.max(0,Math.min(N-1,p));page=p;
  const now=Date.now(),rapid=now-lastShow<400;lastShow=now;
  voice.pause();narrating=false;                       // 先停掉舊朗讀
  img.src=`assets/graphics/${p}.jpg`;img.alt=`繪本第 ${p+1} 頁`;
  img.classList.remove('fade');void img.offsetWidth;img.classList.add('fade');
  $('pg').textContent=`${p+1} / ${N}`;$('prog').style.width=((p+1)/N*100)+'%';
  $('prev').disabled=p===0;$('next').disabled=p===N-1;$('first').disabled=p===0;$('last').disabled=p===N-1;
  document.querySelectorAll('#grid button').forEach((el,i)=>el.classList.toggle('cur',i===p));
  document.documentElement.dataset.page=p+1;
  clearTimeout(audioT);
  if(rapid){bg.pause();setReadUI();audioT=setTimeout(()=>loadAudio(p,readNow),250)}   // 快速連翻：只載入最後停下的那一頁音訊
  else loadAudio(p,readNow);
  log(`換到第 ${p+1} 頁${rapid?'（快速翻頁，音訊稍後載入）':''}`);
}
/* 背景預先載入全部圖片，快速翻頁時圖片才跟得上 */
const warm=[];
function warmImages(i=0){if(i>=N)return;const im=new Image();im.decoding='async';im.onload=im.onerror=()=>setTimeout(()=>warmImages(i+1),60);im.src=`assets/graphics/${i}.jpg`;warm.push(im)}
window.addEventListener('load',()=>setTimeout(warmImages,400));
const go=d=>show(page+d,S.autoRead);

function begin(){if(started)return;started=true;const st=$('start');if(st)st.remove();playBg();log('使用者互動，聲音啟動')}

/* ---------- 按鈕 ---------- */
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('first').onclick=()=>show(0,false);$('last').onclick=()=>show(N-1,false);
$('read').onclick=()=>{begin();if(voice.paused||voice.ended){if(voice.ended)voice.currentTime=0;voice.play().catch(()=>{})}else voice.pause()};
$('replay').onclick=()=>{begin();voice.currentTime=0;voice.play().catch(()=>{})};
$('go').onclick=()=>{begin();voice.play().catch(()=>{})};
$('bgBtn').onclick=()=>{begin();S.bgOn=!S.bgOn;S.bgOn?playBg():bg.pause();applyAudio();log('背景音樂 '+(S.bgOn?'開':'關'))};
$('muteBtn').onclick=()=>{S.muted=!S.muted;applyAudio();log(S.muted?'靜音':'解除靜音')};
$('eyeBtn').onclick=()=>{S.eye=!S.eye;applyAudio()};
$('vol').oninput=e=>{S.vol=+e.target.value;applyAudio()};
$('spd').oninput=e=>{S.spd=+e.target.value;applyAudio()};
$('bgvol').oninput=e=>{S.bgvol=+e.target.value;applyAudio()};
$('eyeLv').oninput=e=>{S.eyeLv=+e.target.value;S.eye=true;applyAudio()};
$('autoRead').onchange=e=>{S.autoRead=e.target.checked;applyAudio()};
$('autoNext').onchange=e=>{S.autoNext=e.target.checked;applyAudio()};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.spd=+b.dataset.s;applyAudio()});

const sp=$('setPanel'),gp=$('grid-panel'),dp=$('dbgPanel');
const toggleDbg=()=>{dp.hidden=!dp.hidden;$('debugBtn').setAttribute('aria-pressed',!dp.hidden);if(!dp.hidden)updDbg()};
$('setBtn').onclick=()=>{gp.hidden=true;sp.hidden=!sp.hidden};
$('gridBtn').onclick=()=>{sp.hidden=true;gp.hidden=!gp.hidden};
$('debugBtn').onclick=toggleDbg;
$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.panel,.tools'))sp.hidden=gp.hidden=true});

for(let i=0;i<N;i++){const b=document.createElement('button');b.setAttribute('aria-label',`第 ${i+1} 頁`);
  b.innerHTML=`<img loading="lazy" src="assets/graphics/${i}.jpg" alt=""><span>${i+1}</span>`;
  b.onclick=()=>{gp.hidden=true;show(i,S.autoRead)};$('grid').appendChild(b)}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input[type=range]'))return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='Home')show(0,false);else if(e.key==='End')show(N-1,false);
  else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();$('read').click()}
  else if(e.key==='m'||e.key==='M')$('muteBtn').click();
  else if(e.key==='d'||e.key==='D')toggleDbg();
  else if(e.key==='Escape')sp.hidden=gp.hidden=true});
let tx=null;const st=$('stage');
st.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
st.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?1:-1);tx=null});

/* ---------- 除錯面板 ---------- */
const f=n=>isFinite(n)?n.toFixed(1):'-';
function updDbg(){
  if(dp.hidden)return;
  $('dbg').textContent=
`頁面：${page+1} / ${N}
圖片：${img.getAttribute('src')}（${img.naturalWidth}×${img.naturalHeight}）
朗讀：${voice.paused?'未播放':'播放中'} ${f(voice.currentTime)}/${f(voice.duration)} 秒
　音量 ${voice.volume.toFixed(2)}　速度 ${voice.playbackRate.toFixed(2)}×　靜音 ${voice.muted}
背景音樂：${bg.getAttribute('src')}
　${bg.paused?'未播放':'播放中'}　音量 ${bg.volume.toFixed(2)}${narrating?'（朗讀中，已降低）':''}　靜音 ${bg.muted}
預載頁：${Object.keys(pre).map(k=>+k+1).join('、')||'無'}
事件：
${logs.join('\n')}`;
}
setInterval(updDbg,400);

/* ---------- 啟動：永遠從第 1 頁開始 ---------- */
document.addEventListener('pointerdown',begin,{once:true,capture:true});
document.addEventListener('keydown',begin,{once:true,capture:true});
applyAudio();show(0,false);
</script>
</body>
</html>
