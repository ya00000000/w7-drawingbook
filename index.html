<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mnanak na qalang｜泰雅族有聲繪本</title>
<style>
:root{--bg:#1b1210;--panel:#2a1b17;--line:#5a2a22;--red:#b3342a;--gold:#e7b04a;--text:#f3e6d3;--muted:#b9a58d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;overflow:hidden;
background-image:repeating-linear-gradient(45deg,rgba(179,52,42,.07) 0 14px,transparent 14px 28px),repeating-linear-gradient(-45deg,rgba(179,52,42,.07) 0 14px,transparent 14px 28px)}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:8px}
.brand{font-size:15px;letter-spacing:.04em;color:var(--gold);font-style:italic}
.tools{display:flex;gap:6px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{background:var(--red);border-color:var(--gold)}
button:disabled{opacity:.35;cursor:default}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px;position:relative}
#stage{position:relative;width:min(100%,calc((100vh - 150px)*4/3));aspect-ratio:4/3;background:#000;border-radius:6px;box-shadow:0 10px 40px #000a;overflow:hidden;touch-action:pan-y}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .45s}
#stage img.off{opacity:0}
footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center}
.bar{width:min(560px,100%);height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
#prog{height:100%;width:0;background:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:min(100%,calc((100vh - 150px)*4/3))}
.mid{display:flex;align-items:center;gap:10px}
.pgbtn{height:52px;min-width:52px;padding:0 16px;font-size:16px;background:var(--red);border-color:var(--gold)}
.pgbtn:disabled{background:var(--panel)}
#pg{text-align:center;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.big{width:56px;height:56px;border-radius:50%;background:var(--red)}
.panel{position:fixed;right:10px;top:calc(62px + env(safe-area-inset-top));width:min(340px,calc(100vw - 20px));max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;z-index:20;box-shadow:0 12px 40px #000c}
.panel[hidden]{display:none}
.panel h2{font-size:16px;margin:0 0 10px;color:var(--gold)}
.ctl{margin:12px 0}
.ctl label,.sw{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--gold);height:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:36px;min-width:52px;font-size:14px}
.sw input{width:22px;height:22px;accent-color:var(--gold)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#grid button{padding:0;height:auto;min-width:0;border-radius:6px;overflow:hidden;position:relative;aspect-ratio:4/3}
#grid img{width:100%;height:100%;object-fit:cover;display:block}
#grid span{position:absolute;left:3px;bottom:2px;font-size:11px;background:#000a;padding:0 4px;border-radius:4px}
#grid .cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
#grid-panel{width:min(520px,calc(100vw - 20px))}
#start{position:fixed;left:0;right:0;bottom:120px;z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;pointer-events:none}
#start button{background:var(--red);border-color:var(--gold);font-size:20px;height:60px;padding:0 34px;border-radius:30px}
#start p{margin:0;color:var(--text);font-size:13px;background:#000b;padding:2px 10px;border-radius:10px}#start button{pointer-events:auto}
#eye{position:fixed;inset:0;pointer-events:none;z-index:50;background:#ff9a1f;mix-blend-mode:multiply;opacity:0;transition:opacity .3s}
@media(max-width:560px){.brand{font-size:13px}.pgbtn span{display:none}.pgbtn{padding:0 12px}.mid{gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">mnanak na qalang</div>
  <div class="tools">
    <button id="bgBtn" aria-pressed="true" aria-label="背景音樂開關" title="背景音樂"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
    <button id="muteBtn" aria-pressed="false" aria-label="全部靜音" title="靜音"><svg id="muteIco" viewBox="0 0 24 24"></svg></button>
    <button id="eyeBtn" aria-pressed="false" aria-label="護眼模式" title="護眼模式"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button id="gridBtn" aria-label="目錄" title="目錄"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
    <button id="setBtn" aria-label="聲音設定" title="設定"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="#2a1b17"/><circle cx="15" cy="12" r="2" fill="#2a1b17"/><circle cx="8" cy="18" r="2" fill="#2a1b17"/></svg></button>
    <button id="fsBtn" aria-label="全螢幕" title="全螢幕"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<main>
  <div id="stage">
    <img id="imgA" alt=""><img id="imgB" class="off" alt="">
  </div>
</main>

<footer>
  <div class="bar"><div id="prog"></div></div>
  <div class="row">
    <button id="prev" class="pgbtn" aria-label="上一頁"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>上一頁</span></button>
    <div class="mid">
      <button id="replay" aria-label="重播本頁"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button id="play" class="big" aria-label="播放朗讀"><svg id="playIco" viewBox="0 0 24 24"></svg></button>
      <button id="pageMusic" aria-pressed="false" aria-label="播放本頁音樂" title="本頁音樂"><svg viewBox="0 0 24 24"><path d="M12 3v10.5a3.5 3.5 0 1 0 2 3.2V7h4V3z"/></svg></button>
    </div>
    <button id="next" class="pgbtn" aria-label="下一頁"><span>下一頁</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div id="pg" aria-live="polite">1 / 20</div>
</footer>

<section class="panel" id="setPanel" hidden aria-label="聲音設定">
  <h2>聲音與閱讀設定</h2>
  <div class="ctl"><label for="vol">朗讀音量 <b id="volV"></b></label><input id="vol" type="range" min="0" max="100"></div>
  <div class="ctl"><label>朗讀速度 <b id="spdV"></b></label>
    <input id="spd" type="range" min="0.5" max="1.5" step="0.05">
    <div class="chips" style="margin-top:6px"><button data-s="0.75">慢 0.75×</button><button data-s="1">正常</button><button data-s="1.25">快 1.25×</button></div></div>
  <div class="ctl"><label for="bgvol">背景音樂音量 <b id="bgvolV"></b></label><input id="bgvol" type="range" min="0" max="100"></div>
  <div class="ctl"><label for="eyeLv">護眼強度 <b id="eyeV"></b></label><input id="eyeLv" type="range" min="10" max="60"></div>
  <label class="sw"><span>翻頁後自動朗讀</span><input id="autoRead" type="checkbox"></label>
  <label class="sw"><span>朗讀完自動翻頁</span><input id="autoNext" type="checkbox"></label>
</section>

<section class="panel" id="grid-panel" hidden aria-label="目錄"><h2>選擇頁面</h2><div id="grid"></div></section>

<div id="start"><button id="go">開始閱讀</button><p>點一下開始朗讀與背景音樂（也可直接按下一頁）</p></div>
<div id="eye"></div>

<audio id="bg" src="assets/music/accompaniment.mp3" loop preload="auto"></audio>
<audio id="voice" preload="auto"></audio>
<audio id="pm" preload="none"></audio>

<script>
const N=20, $=id=>document.getElementById(id);
const bg=$('bg'),voice=$('voice'),pm=$('pm');
const ICON={play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',pause:'<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>',
on:'<path d="M3 9v6h4l5 4V5L7 9z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/>',off:'<path d="M3 9v6h4l5 4V5L7 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'};
let S={vol:100,spd:1,bgvol:25,bgOn:true,muted:false,eye:false,eyeLv:30,autoRead:true,autoNext:false,page:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('qalang')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('qalang',JSON.stringify(S))}catch(e){}};
let started=false,flip=false;

function applyAudio(){
  voice.volume=S.vol/100; voice.muted=S.muted; voice.playbackRate=S.spd; voice.defaultPlaybackRate=S.spd;
  pm.volume=S.vol/100; pm.muted=S.muted;
  bg.volume=S.bgvol/100; bg.muted=S.muted||!S.bgOn;
  $('volV').textContent=S.vol+'%'; $('spdV').textContent=S.spd.toFixed(2)+'×'; $('bgvolV').textContent=S.bgvol+'%'; $('eyeV').textContent=S.eyeLv+'%';
  $('vol').value=S.vol;$('spd').value=S.spd;$('bgvol').value=S.bgvol;$('eyeLv').value=S.eyeLv;
  $('autoRead').checked=S.autoRead;$('autoNext').checked=S.autoNext;
  $('bgBtn').setAttribute('aria-pressed',S.bgOn);$('muteBtn').setAttribute('aria-pressed',S.muted);$('eyeBtn').setAttribute('aria-pressed',S.eye);
  $('muteIco').innerHTML=S.muted?ICON.off:ICON.on;
  $('eye').style.opacity=S.eye?S.eyeLv/100:0;
  document.querySelectorAll('[data-s]').forEach(b=>b.style.borderColor=(+b.dataset.s===+S.spd)?'var(--gold)':'');
  if(started&&S.bgOn&&bg.paused)bg.play().catch(()=>{});
  save();
}
function setPlayIcon(){$('playIco').innerHTML=voice.paused?ICON.play:ICON.pause;$('play').setAttribute('aria-label',voice.paused?'播放朗讀':'暫停朗讀')}

const cache={};
function preload(i){
  if(i<0||i>=N||cache[i])return;
  const im=new Image();im.src=`assets/graphics/${i}.jpg`;
  const a=new Audio();a.preload='auto';a.src=`assets/speech/speech${i}.mp3`;
  [['image',im.src],['audio',a.src]].forEach(([t,u])=>{const l=document.createElement('link');l.rel='preload';l.as=t;l.href=u;l.dataset.preloadPage=i+1;document.head.appendChild(l)});
  cache[i]=[im,a];
}
function begin(){if(started)return;started=true;const st=$('start');if(st)st.remove();if(S.bgOn)bg.play().catch(()=>{})}
function show(p,autoplay){
  p=Math.max(0,Math.min(N-1,p));S.page=p;
  const [a,b]=flip?[$('imgB'),$('imgA')]:[$('imgA'),$('imgB')];
  a.src=`assets/graphics/${p}.jpg`;a.alt=`繪本第 ${p+1} 頁`;
  a.classList.remove('off');b.classList.add('off');flip=!flip;
  [p+1,p+2,p-1].forEach(preload);
  $('pg').textContent=`${p+1} / ${N}`;$('prog').style.width=((p+1)/N*100)+'%';
  $('prev').disabled=p===0;$('next').disabled=p===N-1;
  document.querySelectorAll('#grid button').forEach((el,i)=>el.classList.toggle('cur',i===p));
  pm.pause();$('pageMusic').setAttribute('aria-pressed',false);
  voice.src=`assets/speech/speech${p}.mp3`;voice.playbackRate=S.spd;
  if(autoplay&&started)voice.play().catch(()=>{});
  setPlayIcon();save();
}
const go=d=>show(S.page+d,S.autoRead||!voice.paused);

voice.addEventListener('play',setPlayIcon);voice.addEventListener('pause',setPlayIcon);
voice.addEventListener('ended',()=>{setPlayIcon();if(S.autoNext&&S.page<N-1)setTimeout(()=>{if(voice.ended)show(S.page+1,true)},1200)});
$('play').onclick=()=>voice.paused?voice.play():voice.pause();
$('replay').onclick=()=>{voice.currentTime=0;voice.play()};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('pageMusic').onclick=()=>{
  if(pm.paused){pm.src=`assets/music/music${S.page}.mp3`;pm.play().catch(()=>{});$('pageMusic').setAttribute('aria-pressed',true)}
  else{pm.pause();$('pageMusic').setAttribute('aria-pressed',false)}};
$('bgBtn').onclick=()=>{S.bgOn=!S.bgOn;S.bgOn?bg.play().catch(()=>{}):bg.pause();applyAudio()};
$('muteBtn').onclick=()=>{S.muted=!S.muted;applyAudio()};
$('eyeBtn').onclick=()=>{S.eye=!S.eye;applyAudio()};
$('vol').oninput=e=>{S.vol=+e.target.value;applyAudio()};
$('spd').oninput=e=>{S.spd=+e.target.value;applyAudio()};
$('bgvol').oninput=e=>{S.bgvol=+e.target.value;applyAudio()};
$('eyeLv').oninput=e=>{S.eyeLv=+e.target.value;S.eye=true;applyAudio()};
$('autoRead').onchange=e=>{S.autoRead=e.target.checked;applyAudio()};
$('autoNext').onchange=e=>{S.autoNext=e.target.checked;applyAudio()};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.spd=+b.dataset.s;applyAudio()});

const sp=$('setPanel'),gp=$('grid-panel');
$('setBtn').onclick=()=>{gp.hidden=true;sp.hidden=!sp.hidden};
$('gridBtn').onclick=()=>{sp.hidden=true;gp.hidden=!gp.hidden};
$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.panel,.tools'))sp.hidden=gp.hidden=true});

for(let i=0;i<N;i++){const b=document.createElement('button');b.setAttribute('aria-label',`第 ${i+1} 頁`);
  b.innerHTML=`<img loading="lazy" src="assets/graphics/${i}.jpg" alt=""><span>${i+1}</span>`;
  b.onclick=()=>{gp.hidden=true;show(i,S.autoRead)};$('grid').appendChild(b)}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input[type=range]'))return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();$('play').click()}
  else if(e.key==='m'||e.key==='M')$('muteBtn').click();
  else if(e.key==='Escape')sp.hidden=gp.hidden=true});
let tx=null;const st=$('stage');
st.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
st.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?1:-1);tx=null});

$('go').onclick=()=>{begin();show(S.page,true)};
document.addEventListener('pointerdown',begin,{once:true,capture:true});document.addEventListener('keydown',begin,{once:true,capture:true});
applyAudio();show(S.page,false);document.documentElement.dataset.page=S.page+1;
</script>
</body>
</html>
